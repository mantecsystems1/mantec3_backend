name: Deploy Backend Nest

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  quality:
    name: Qualidade backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint incremental
        run: npm run lint:check

      - name: Testes unitarios
        run: npm test -- --runInBand

      - name: Testes e2e
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

  deploy:
    if: github.event_name == 'push'
    needs: quality
    runs-on: [self-hosted, prod]
    env:
      IMAGE_REPO: mantecsystems/mantec3-back

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin

      - name: Build imagem
        run: |
          docker build \
            --pull \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_REPOSITORY}" \
            -t "${IMAGE_REPO}:latest" \
            -t "${IMAGE_REPO}:${GITHUB_SHA}" \
            .

      - name: Push imagem
        run: |
          docker push "${IMAGE_REPO}:latest"
          docker push "${IMAGE_REPO}:${GITHUB_SHA}"

      - name: Deploy no Swarm stack
        run: |
          docker pull "${IMAGE_REPO}:${GITHUB_SHA}"
          docker stack deploy \
            --with-registry-auth \
            --resolve-image always \
            -c /home/lemuel/stacks/05-apps/mantec3.yml \
            mantec3

      - name: Forcar backend para imagem do commit
        run: |
          services="$(docker stack services mantec3 --format '{{.Name}} {{.Image}}' | awk -v repo="${IMAGE_REPO}" '$1 == "mantec3_mantec3" && $2 ~ "^" repo {print $1}')"

          if [ -z "$services" ]; then
            echo "O servico mantec3_mantec3 nao foi encontrado com a imagem ${IMAGE_REPO}."
            docker stack services mantec3
            exit 1
          fi

          for service in $services; do
            echo "Atualizando $service para ${IMAGE_REPO}:${GITHUB_SHA}"
            docker service update \
              --with-registry-auth \
              --image "${IMAGE_REPO}:${GITHUB_SHA}" \
              --detach=false \
              --force \
              "$service"
          done

      - name: Verificar imagem em execucao
        run: |
          services="$(docker stack services mantec3 --format '{{.Name}} {{.Image}}' | awk -v repo="${IMAGE_REPO}" '$1 == "mantec3_mantec3" && $2 ~ "^" repo {print $1}')"

          for service in $services; do
            docker service inspect "$service" --format 'service={{.Spec.Name}} image={{.Spec.TaskTemplate.ContainerSpec.Image}}'
            docker service ps "$service" \
              --no-trunc \
              --filter desired-state=running \
              --format 'task={{.Name}} image={{.Image}} current={{.CurrentState}} error={{.Error}}' \
              | head -5
          done
